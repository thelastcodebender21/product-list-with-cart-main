<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout-Popup</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/styles.css">

</head>
<body>
  <div class="order-confirmed-container">
    <div class="order-confirmed-grey">
      <h1>Desserts</h1>
    </div>
    <div class="order-confirmed-white">
      <img src="/assets/images/icon-order-confirmed.svg" alt="" id="check-mark">
      <h1>Order Confirmed</h1>
      <h5>We hope you enjoy your food!</h5>
      <div class="order-confirmed-products-section">
        <div class="order-confirmed-product">
          <div class="order-confirmed-product-image-text">
            <img src="/assets/images/image-waffle-thumbnail.jpg" alt="">
            <div class="order-confirmed-product-text">
              <p>Waffle with Berries</p>
              <p><span>1x </span><span>@ $5.50  </span></p>
            </div>
          </div>
            <div class="order-confirmed-product-price">
              <p>$5.50</p>
            </div>
        </div>

        <hr>

        <div class="order-confirmed-product">
            <div class="order-confirmed-product-image-text">
              <img src="/assets/images/image-creme-brulee-thumbnail.jpg" alt="">
              <div class="order-confirmed-product-text">
                <p>Vanilla Bean Crème B..</p>
                <p><span>1x </span><span>@ $7.00  </span></p>
              </div>
            </div>
            <div class="order-confirmed-product-price">
                <p class="order-confirmed-product-price-text">$5.50</p>
             </div>
          </div>

          <hr>

        <div class="order-confirmed-product">
              <div class="order-confirmed-product-image-text">
                <img src="/assets/images/image-macaron-thumbnail.jpg" alt="">
                <div class="order-confirmed-product-text">
                  <p>Macaron Mix of Five</p>
                  <p><span>1x </span><span>@ $8.00  </span></p>
                </div>
              </div>
                <div class="order-confirmed-product-price">
                  <p>$5.50</p>
                </div>
            </div>

          <hr>
              
        <div class="delivery-fee">
            <p>Delivery Fee</p>
            <p>$10</p>
        </div>

        
      </div>
      <a href="index.html">Start New Order</a>
      </div>
    </div>
    </div>
  </div>
</body>
</html>
